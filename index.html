<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clean Calculator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="calculator">
    <button class="toggle-mode" onclick="toggleDarkMode()">🌙 / ☀️</button>
    <input type="text" id="inputBox" readonly />

    <table>
      <tr>
        <td onclick="appendValue('7')" class="number">7</td>
        <td onclick="appendValue('8')" class="number">8</td>
        <td onclick="appendValue('9')" class="number">9</td>
        <td onclick="appendValue('/')" class="operator"><i class="fas fa-divide"></i></td>
      </tr>
      <tr>
        <td onclick="appendValue('4')" class="number">4</td>
        <td onclick="appendValue('5')" class="number">5</td>
        <td onclick="appendValue('6')" class="number">6</td>
        <td onclick="appendValue('*')" class="operator"><i class="fas fa-xmark"></i></td>
      </tr>
      <tr>
        <td onclick="appendValue('1')" class="number">1</td>
        <td onclick="appendValue('2')" class="number">2</td>
        <td onclick="appendValue('3')" class="number">3</td>
        <td onclick="appendValue('-')" class="operator"><i class="fas fa-minus"></i></td>
      </tr>
      <tr>
        <td colspan="2" onclick="appendValue('0')" class="number">0</td>
        <td onclick="clearInput()" class="function">AC</td>
        <td onclick="appendValue('+')" class="operator"><i class="fas fa-plus"></i></td>
      </tr>
      <tr>
        <td colspan="4" onclick="calculateResult()" class="equals">=</td>
      </tr>
    </table>

    <audio id="clickSound" src="https://www.soundjay.com/buttons/sounds/button-16.mp3" preload="auto"></audio>
  </div>

  <script>
    let currentInput = "";

    function playClick() {
      document.getElementById("clickSound").play();
    }

    function appendValue(value) {
      playClick();
      currentInput += value;
      document.getElementById("inputBox").value = currentInput;
    }

    function clearInput() {
      playClick();
      currentInput = "";
      document.getElementById("inputBox").value = "";
    }

    function calculateResult() {
      playClick();
      try {
        const result = eval(currentInput);
        document.getElementById("inputBox").value = result;
        currentInput = result.toString();
      } catch {
        document.getElementById("inputBox").value = "Error";
        currentInput = "";
      }
    }

    function toggleDarkMode() {
      document.body.classList.toggle("dark");
    }
  </script>
</body>
</html>
